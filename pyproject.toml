[project]
name = "promptchad"
version = "0.1.0"
description = "A/B test prompts across multiple AI providers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.35.1",
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "flask>=3.1.3",
    "tomli-w>=1.2.0",
]

[project.scripts]
promptchad = "promptchad:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
